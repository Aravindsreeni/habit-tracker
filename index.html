<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/grove/styles.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/grove-app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#faf8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- Scrollable app content -->
<div class="screen">

  <!-- ── TODAY ──────────────────────────────────────────────────── -->
  <div data-dest-panel="today">
    <div class="pnl on" id="p-today"></div>
  </div><!-- /today -->

  <!-- ── HABITS ─────────────────────────────────────────────────── -->
  <div data-dest-panel="habits" hidden>

    <!-- Weekly -->
    <div class="pnl on" id="p-weekly">
      <div id="wsum" class="sm"></div>
      <div class="sec-hdr">
        <span class="sec-lbl" id="wlbl"></span>
        <button class="sec-add" onclick="showAddForm('weekly')">+ Add habit</button>
      </div>
      <div class="ahfrm" id="af-weekly">
        <div class="frow">
          <input class="fi" id="fn-weekly" type="text" placeholder="Habit name">
          <input class="fnum" id="ft-weekly" type="number" min="1" max="7" value="3" placeholder="Days / week">
        </div>
        <div class="fact">
          <button class="fcx" onclick="closeAddForm('weekly')">Cancel</button>
          <button class="fsv" onclick="addHabit('weekly')">Add</button>
        </div>
      </div>
      <div id="wl"></div>
    </div>

    <!-- Monthly -->
    <div class="pnl on" id="p-monthly">
      <div id="msum" class="sm"></div>
      <div class="sec-hdr">
        <span class="sec-lbl" id="mlbl"></span>
        <button class="sec-add" onclick="showAddForm('monthly')">+ Add habit</button>
      </div>
      <div class="ahfrm" id="af-monthly">
        <div class="frow">
          <input class="fi" id="fn-monthly" type="text" placeholder="Habit name">
          <input class="fnum" id="ft-monthly" type="number" min="1" max="31" value="7" placeholder="Days / month">
        </div>
        <div class="fact">
          <button class="fcx" onclick="closeAddForm('monthly')">Cancel</button>
          <button class="fsv" onclick="addHabit('monthly')">Add</button>
        </div>
      </div>
      <div id="ml"></div>
    </div>

    <!-- Quarterly -->
    <div class="pnl on" id="p-quarterly">
      <div id="qtsum" class="sm"></div>
      <div class="sec-hdr">
        <span class="sec-lbl" id="qtlbl"></span>
        <button class="sec-add" onclick="showAddForm('quarterly')">+ Add goal</button>
      </div>
      <div class="ahfrm" id="af-quarterly">
        <div class="frow">
          <input class="fi" id="fn-quarterly" type="text" placeholder="Goal name">
          <input class="fnum" id="ft-quarterly" type="number" min="1" max="99" value="1" placeholder="Target / quarter">
        </div>
        <div class="frow">
          <select class="fse" id="fl-quarterly" style="flex:1">
            <option value="">No link — manual counter</option>
          </select>
        </div>
        <div class="fact">
          <button class="fcx" onclick="closeAddForm('quarterly')">Cancel</button>
          <button class="fsv" onclick="addHabit('quarterly')">Add</button>
        </div>
      </div>
      <div id="qtl"></div>
    </div>

    <!-- Yearly -->
    <div class="pnl on" id="p-yearly">
      <div id="yrsum" class="sm"></div>
      <div class="sec-hdr">
        <span class="sec-lbl" id="yrlbl"></span>
        <button class="sec-add" onclick="showAddForm('yearly')">+ Add goal</button>
      </div>
      <div class="ahfrm" id="af-yearly">
        <div class="frow">
          <input class="fi" id="fn-yearly" type="text" placeholder="Goal name">
          <input class="fnum" id="ft-yearly" type="number" min="1" max="365" value="1" placeholder="Target / year">
        </div>
        <div class="frow">
          <select class="fse" id="fl-yearly" style="flex:1">
            <option value="">No link — manual counter</option>
          </select>
        </div>
        <div class="fact">
          <button class="fcx" onclick="closeAddForm('yearly')">Cancel</button>
          <button class="fsv" onclick="addHabit('yearly')">Add</button>
        </div>
      </div>
      <div id="yrl"></div>
    </div>

  </div><!-- /habits -->

  <!-- ── REFLECT ────────────────────────────────────────────────── -->
  <div data-dest-panel="reflect" hidden>
    <div class="pnl on" id="p-inbox"></div>
    <div class="pnl on" id="p-journal"></div>
    <div class="pnl on" id="p-mood"></div>
    <div class="pnl on" id="p-cbt"></div>
  </div><!-- /reflect -->

  <!-- ── CALM ───────────────────────────────────────────────────── -->
  <div data-dest-panel="calm" hidden>
    <div class="pnl on" id="p-mindfulness"></div>
  </div><!-- /calm -->

  <!-- ── YOU ────────────────────────────────────────────────────── -->
  <div data-dest-panel="you" hidden>
    <div class="pnl on" id="p-stats"></div>
    <div class="pnl on" id="p-settings"></div>
    <div class="syncsec">
      <div class="sync-row">
        <button class="syncbtn" id="syncbtn">↑ Sync to Drive</button>
        <button class="syncbtn" id="loadbtn">↓ Load from Drive</button>
      </div>
      <div class="sync-row">
        <button class="syncbtn" id="exportbtn">⬇ Export JSON</button>
        <button class="syncbtn" id="importbtn">⬆ Import JSON</button>
      </div>
      <div class="syncinfo" id="syncinfo">Sync to Google Drive to access your habits from any device.</div>
    </div>
  </div><!-- /you -->

</div><!-- /.screen -->

<div id="toast"></div>

<!-- Fixed bottom tab bar -->
<div class="tabhost">
  <nav class="grv-tabbar" role="tablist" aria-label="Main navigation">
    <button class="grv-tab" role="tab" data-dest="today" aria-selected="true" onclick="sw('today')">
      <i data-lucide="sun" width="20" height="20" stroke-width="1.9"></i>
      Today
    </button>
    <button class="grv-tab" role="tab" data-dest="habits" aria-selected="false" onclick="sw('habits')">
      <i data-lucide="circle-check" width="20" height="20" stroke-width="1.9"></i>
      Habits
    </button>
    <button class="grv-tab" role="tab" data-dest="reflect" aria-selected="false" onclick="sw('reflect')">
      <i data-lucide="book-open" width="20" height="20" stroke-width="1.9"></i>
      Reflect
    </button>
    <button class="grv-tab" role="tab" data-dest="calm" aria-selected="false" onclick="sw('calm')">
      <i data-lucide="wind" width="20" height="20" stroke-width="1.9"></i>
      Calm
    </button>
    <button class="grv-tab" role="tab" data-dest="you" aria-selected="false" onclick="sw('you')">
      <i data-lucide="bar-chart-3" width="20" height="20" stroke-width="1.9"></i>
      You
    </button>
  </nav>
</div>

<script src="js/vendor/lucide.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // Skip the service worker inside the Capacitor native shell — it serves the
  // bundled assets itself, so an app-shell cache would only risk staleness.
  if ('serviceWorker' in navigator && !window.Capacitor) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisLoaded()"></script>
</body>
</html>
